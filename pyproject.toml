[project]
name = "rpa-geo"
version = "0.4.0"
description = "Canonical US county/county-equivalent reference and per-repo crosswalks for RPA pipeline repos"
readme = "README.md"
authors = [
    { email = "cmihiar@ctrees.org" }
]
requires-python = ">=3.12"
dependencies = [
    "pandera[pandas]>=0.32.1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.8",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
